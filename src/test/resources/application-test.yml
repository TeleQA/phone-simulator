spring:
  threads:
    virtual:
      enabled: false
  kafka:
    bootstrap-servers: localhost:9092
phonesim:
  scheduler:
    base-url: http://localhost:9999
  kafka:
    timer-topic: phonesim.timers.v1
    call-event-topic: call-event-queue
  defaults:
    voice-mo-service-key: 201
    voice-mo-roaming-service-key: 200
    voice-mt-service-key: 101
    sms-service-key: 205
    smsc-address: "994550000342"
  webhook:
    fallback-url:
    max-retries: 1
    initial-backoff-ms: 10
    max-backoff-ms: 50
    max-concurrent: 16
    request-timeout-ms: 1000
