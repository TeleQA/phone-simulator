server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: phone-simulator
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: phonesim-timer-firer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: com.azerconnect.phonesim.adapter.kafka

phonesim:
  scheduler:
    base-url: ${SCHEDULER_URL:http://localhost:8080}
    connect-timeout-ms: 1000
    read-timeout-ms: 3000
  kafka:
    timer-topic: phonesim.timers.v1
    call-event-topic: ${PHONESIM_CALL_EVENT_TOPIC:call-event-queue}
    answer-event-topic: ${PHONESIM_ANSWER_EVENT_TOPIC:cap.answer-events.v1}
    hangup-event-topic: ${PHONESIM_HANGUP_EVENT_TOPIC:phonesim.hangup-events.v1}
    listener-concurrency: 4
  call:
    no-answer-timeout: 30s
  defaults:
    voice-mo-service-key: 201
    voice-mo-roaming-service-key: 200
    voice-mt-service-key: 101
    sms-service-key: 205
    smsc-address: "994550000342"
  redis:
    call-ttl: 2h
  webhook:
    fallback-url:
    max-retries: 4
    initial-backoff-ms: 500
    max-backoff-ms: 8000
    max-concurrent: 256
    request-timeout-ms: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.azerconnect.phonesim: INFO
